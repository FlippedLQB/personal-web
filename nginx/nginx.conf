# ============================================================
# 个人博客 Nginx 配置
# 包含：前台站点、后台站点、HTTPS、Gzip、静态资源缓存、限流
# ============================================================

# 限流区域定义
limit_req_zone $binary_remote_addr zone=blog_limit:10m rate=10r/s;

# Gzip 压缩配置
gzip on;
gzip_min_length 1k;
gzip_comp_level 6;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
gzip_vary on;
gzip_buffers 4 16k;

# 静态资源缓存
proxy_cache_path /data/nginx/cache levels=1:2 keys_zone=blog_cache:10m max_size=1g inactive=7d use_temp_path=off;

# ============================================================
# HTTP → HTTPS 重定向（生产环境启用）
# ============================================================
server {
    listen 80;
    server_name yourdomain.com admin.yourdomain.com;
    # 开发阶段不强制跳转，生产环境取消下面注释
    # return 301 https://$host$request_uri;

    # --- 开发阶段直接服务（生产环境删除此block内容） ---
    # 前台站点
    root /data/blog/dist-front;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
# 前台站点（HTTPS）
# ============================================================
server {
    listen 443 ssl;
    server_name yourdomain.com;

    # SSL 证书（替换为实际路径）
    ssl_certificate     /etc/nginx/ssl/yourdomain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/yourdomain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前台静态资源
    root /data/blog/dist-front;
    index index.html;

    # 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（JS/CSS/图片）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理
    location /api/ {
        limit_req zone=blog_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传文件大小限制
        client_max_body_size 10m;
    }

    # index.html 不缓存（确保前端更新即时生效）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ============================================================
# 后台站点（HTTPS + IP白名单）
# ============================================================
server {
    listen 443 ssl;
    server_name admin.yourdomain.com;

    # SSL 证书
    ssl_certificate     /etc/nginx/ssl/admin.yourdomain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.yourdomain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # IP 白名单（替换为你的公网IP，多个用空格分隔）
    # allow 你的公网IP;
    # deny all;

    # 后台静态资源
    root /data/blog/dist-admin;
    index index.html;

    # 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理
    location /api/ {
        limit_req zone=blog_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传文件大小限制
        client_max_body_size 10m;
    }

    # index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
